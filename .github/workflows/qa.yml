name: Quality Assurance

on:
    pull_request:
    push:

permissions:
    contents: read

env:
    RUST_VERSION: stable

jobs:
    lint:
        name: Lint
        runs-on: macos-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: ${{ env.RUST_VERSION }}
                  components: clippy

            - name: Check code quality
              run: make lint

    test:
        name: Test
        strategy:
            matrix:
                runner: [macos-26-intel, macos-26]
        runs-on: ${{ matrix.runner }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: ${{ env.RUST_VERSION }}

            - name: Test
              run: make test
