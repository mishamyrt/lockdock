name: Release

on:
    push:
        tags:
            - "*"

permissions:
    contents: write

env:
    LLVM_VERSION: 22

jobs:
    build:
        name: Build macOS ${{ matrix.asset_arch }}
        runs-on: ${{ matrix.runner }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-26-intel
                      asset_arch: amd64
                    - runner: macos-26
                      asset_arch: arm64

        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2

            - name: Setup LLVM
              run: |
                  brew install llvm@${{ env.LLVM_VERSION }}
                  echo "$(brew --prefix llvm@${{ env.LLVM_VERSION }})/bin/" >> $GITHUB_PATH

            - name: Build release asset
              env:
                  TAG: ${{ github.ref_name }}
                  ASSET_ARCH: ${{ matrix.asset_arch }}
              run: |
                  set -euo pipefail

                  rm -rf build dist

                  make

                  test -x build/lockdock

                  mkdir -p dist

                  archive="lockdock_${TAG}_darwin_${ASSET_ARCH}.tar.gz"
                  tar -C build -czf "dist/${archive}" lockdock

            - name: Upload release asset
              uses: actions/upload-artifact@v4
              with:
                  name: release-asset-darwin-${{ matrix.asset_arch }}
                  path: dist/*.tar.gz
                  if-no-files-found: error
                  retention-days: 1

    release:
        name: Create Release
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2

            - name: Download release assets
              uses: actions/download-artifact@v5
              with:
                  pattern: release-asset-*
                  path: dist
                  merge-multiple: true

            - name: Generate checksums
              run: |
                  set -euo pipefail

                  find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit | grep -q .

                  (
                    cd dist
                    sha256sum *.tar.gz > sha256sums.txt
                  )

            - name: Extract release notes
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail

                  version="${TAG#v}"

                  awk -v version="${version}" '
                    BEGIN {
                      header = "## [" version "]"
                      capture = 0
                      found = 0
                      printed = 0
                    }
                    index($0, header) == 1 {
                      capture = 1
                      found = 1
                    }
                    capture {
                      if (printed && ($0 ~ /^## \[/ || $0 ~ /^<!-- generated by git-cliff -->/)) {
                        exit
                      }

                      print
                      printed = 1
                    }
                    END {
                      if (!found) {
                        printf("Release notes for version %s were not found in CHANGELOG.md\n", version) > "/dev/stderr"
                        exit 1
                      }
                    }
                  ' CHANGELOG.md > dist/release-notes.md

            - name: Publish release
              uses: softprops/action-gh-release@v3.0.0
              with:
                  body_path: dist/release-notes.md
                  files: |
                      dist/*.tar.gz
                      dist/sha256sums.txt
                  fail_on_unmatched_files: true
                  overwrite_files: true

            - name: Checkout Homebrew tap
              uses: actions/checkout@v6.0.2
              with:
                  repository: mishamyrt/homebrew-tap
                  token: ${{ secrets.HOMEBREW_TAP_TOKEN || vars.HOMEBREW_TAP_TOKEN }}
                  path: homebrew-tap

            - name: Update Homebrew tap
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail

                  version="${TAG#v}"

                  archive_sha() {
                    local archive="$1"
                    local sha

                    sha="$(awk -v archive="${archive}" '$2 == archive { print $1 }' dist/sha256sums.txt)"
                    if [ -z "${sha}" ]; then
                      printf 'Checksum for %s was not found in dist/sha256sums.txt\n' "${archive}" >&2
                      exit 1
                    fi

                    printf '%s\n' "${sha}"
                  }

                  arm64_archive="lockdock_${TAG}_darwin_arm64.tar.gz"
                  amd64_archive="lockdock_${TAG}_darwin_amd64.tar.gz"

                  arm64_sha="$(archive_sha "${arm64_archive}")"
                  amd64_sha="$(archive_sha "${amd64_archive}")"

                  cat > homebrew-tap/Formula/lockdock.rb <<EOF
                  class Lockdock < Formula
                    desc "macOS Dock position fixer"
                    homepage "https://github.com/mishamyrt/lockdock"
                    version "${version}"
                    license "MIT"

                    depends_on :macos

                    if Hardware::CPU.arm?
                      url "https://github.com/mishamyrt/lockdock/releases/download/${TAG}/${arm64_archive}"
                      sha256 "${arm64_sha}"
                    else
                      url "https://github.com/mishamyrt/lockdock/releases/download/${TAG}/${amd64_archive}"
                      sha256 "${amd64_sha}"
                    end

                    def install
                      bin.install "lockdock"
                    end

                    def post_install
                      pid_path = File.expand_path("~/Library/Caches/co.myrt.lockdock/daemon.pid")
                      return unless File.exist?(pid_path)

                      pid_text = File.read(pid_path).strip
                      return unless pid_text.match?(/\A\d+\z/)

                      Process.kill("TERM", pid_text.to_i)
                    rescue Errno::ENOENT, Errno::ESRCH
                      nil
                    end

                    test do
                      assert_match version.to_s, shell_output("#{bin}/lockdock version")
                    end
                  end
                  EOF

                  cd homebrew-tap

                  if git diff --quiet -- Formula/lockdock.rb; then
                    echo "Homebrew formula is already up to date"
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add Formula/lockdock.rb
                  git commit -m "chore: update lockdock formula to ${TAG}"
                  git push
