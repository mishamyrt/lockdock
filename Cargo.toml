[workspace]
members = [
    "crates/lockdock",
    "crates/lockdock-daemon",
    "crates/lockdock-display",
    "crates/lockdock-ipc",
    "crates/lockdock-mouse",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"
version = "0.4.4"
license = "MIT"
repository = "https://github.com/mishamyrt/lockdock"

[workspace.dependencies]
lockdock-mouse = { path = "crates/lockdock-mouse" }
lockdock-display = { path = "crates/lockdock-display" }
lockdock-ipc = { path = "crates/lockdock-ipc" }
lockdock-daemon = { path = "crates/lockdock-daemon" }
lockdock-geometry = { path = "crates/lockdock-geometry" }
lockdock = { path = "crates/lockdock" }

serde = { version = "1.0.228", features = ["derive"] }
libc = "0.2"
serde_json = "1.0.145"
thiserror = "2.0.18"
clap = { version = "4.5.53", features = ["derive"] }
lunchd = "0.1.1"
cc = "1.2.47"
prefs = { git = "https://github.com/mishamyrt/prefs", package = "prefs" }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
single_match_else = "allow"
too_many_lines = "allow"
needless_raw_string_hashes = "allow"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
redundant_clone = "warn"
debug_assert_with_mut_call = "warn"
unused_peekable = "warn"
large_stack_arrays = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
